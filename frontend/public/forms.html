<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Portfolio forms</title>
  </head>
  <body>
    <form data-netlify="true" name="portfolio-booking" netlify-honeypot="bot-field" hidden>
      <input name="form-name" type="hidden" value="portfolio-booking" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="company" />
      <input name="meetingType" />
      <input name="budget" />
      <input name="preferredDate" type="date" />
      <input name="timezone" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
